name: Build and Release

# 1. 触发条件：当你推送一个以 'v' 开头的标签时，例如 v1.0.0
on:
  push:
    tags:
      - 'v0.1'

jobs:
  build-and-publish:
    name: Build on Windows
    runs-on: windows-latest  # 在 Windows 环境下构建，你也可以换成 macos-latest 或 ubuntu-latest
    
    steps:
    # 2. 拉取你的源代码
    - name: Checkout code
      uses: actions/checkout@v4

    # 3. 安装 Qt 环境 (使用社区提供的 Action)
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.0'          # 指定与你项目匹配的 Qt 版本
        arch: 'win64_msvc2019_64' # 指定目标架构
        # 如果项目需要额外的模块，可以在这里添加，例如: modules: 'qtcharts qtwebengine'

    # 4. 编译你的项目 (这里以 CMake 为例，qmake 也类似)
    #    注意：你需要将下面的命令换成你项目实际的编译指令
    - name: Build project
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --config Release

    # 5. 部署/打包 (核心步骤)
    #    这一步会使用 windeployqt 工具自动收集你程序需要的所有 Qt 依赖库（.dll文件）
    - name: Deploy with windeployqt
      run: |
        mkdir package
        # 假设你的可执行文件在 build/Release/ 目录下，名为 MyApp.exe
        windeployqt --qmldir . build/Release/MyApp.exe --dir package
        # 将你的可执行文件也复制到打包目录
        copy build/Release/MyApp.exe package\

    # 6. 创建压缩包 (使用 PowerShell 的内置命令)
    - name: Create ZIP archive
      shell: pwsh
      run: |
        Compress-Archive -Path .\package\* -DestinationPath MyApp-Windows.zip

    # 7. 创建 GitHub Release 并上传压缩包 (关键步骤)
    - name: Create Release and Upload Asset
      uses: softprops/action-gh-release@v2
      with:
        files: MyApp-Windows.zip
        generate_release_notes: true  # 自动生成版本更新日志
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub 会自动提供这个 Token